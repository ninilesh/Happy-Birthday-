<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        p {
            font-size: 1.5rem;
        }
        .wishes {
            font-style: italic;
            margin: 20px 0;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Yahan Balloons ya Cake ki emoji daal sakte ho -->
        <div style="font-size: 50px;">🎂🎈🎉</div>
        <h1>Happy Birthday, jyoti kanojia ! 🎉</h1>
        <p class="wishes">"🎂 Happy Birthday, chinu ! May this year bring you happiness, success, and endless smiles. Have an amazing day! 🎉✨"</p>
        <p>Best Wishes From: <strong>nilesh raikwar</strong></p>
    </div>

</body>
</html>
